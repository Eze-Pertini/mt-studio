<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Metadatos por página ─────────────────────────
         title, description, canonical, Open Graph y Twitter los emite
         SEOHead en cada ruta y quedan escritos en el HTML generado en
         build. No duplicarlos acá: se imprimirían dos veces. -->

    <!-- ─── Favicon ─────────────────────────────────── -->
    <!-- https://realfavicongenerator.net -->
    <link rel="icon" type="image/png" href="/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MT Studio" />
    <link rel="manifest" href="/my-favicon/site.webmanifest" />
    <meta name="theme-color" content="#080B10" />

    <!-- ─── Fuente ──────────────────────────────────────
         Autohospedada. La precarga la saca de la cadena de descubrimiento:
         sin esto el navegador recien la pide despues de parsear el CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/inter-latin-variable.woff2" />

    <!-- ─── Analytics ───────────────────────────────────
         Se carga despues de load. Analytics no aporta nada a lo que el
         visitante ve, asi que no tiene por que competir por ancho de banda
         con lo que si: en movil eran ~90 KB de tercero peleando con el
         primer render. La cola de gtag se arma antes, asi que ningun
         evento disparado en el arranque se pierde. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WYJ9WZM84Z');

      addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-WYJ9WZM84Z';
        document.head.appendChild(s);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
